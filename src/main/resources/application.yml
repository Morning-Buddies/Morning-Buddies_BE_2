spring:
  jwt:
    secret: ${JWT_SECRET}

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

logging:
  level:
    org.hibernate.type: trace
    org:
      springframework:
        web:
          socket: DEBUG
    com:
      morningbuddies: DEBUG

decorator:
  datasource:
    p6spy:
      enable-logging: true

aws:
  access_key: ${AWS_S3_ACCESS_KEY}
  secret_key: ${AWS_S3_SECRET_KEY}
  s3:
    bucket_name: ${AWS_S3_BUCKET_NAME}
    url: ${AWS_S3_URL}
  region: ${AWS_REGION}

openai:
  api:
    key: ${OPENAI_API_KEY}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: always